[build-system]
requires = ["editables>=0.6,<1", "hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "extent-api"
version = "0.1.0"
description = "FastAPI backend authority for the Extent evidence desk."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.18,<2",
  "cryptography>=46,<47",
  "fastapi>=0.116,<1",
  "google-api-python-client>=2.198,<3",
  "google-auth>=2.56,<3",
  "google-auth-oauthlib>=1.4,<2",
  "pgvector>=0.5,<1",
  "Pillow>=12.3,<13",
  "psycopg[binary]>=3.3,<4",
  "pydantic-settings>=2.10,<3",
  "pypdf>=6,<7",
  "pypdfium2>=5.12,<6",
  "redis>=7.4,<8",
  "rq>=2.10,<3",
  "SQLAlchemy>=2.0,<2.1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.7,<3",
  "mypy>=1.16,<2",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/extent_api"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "live: opt-in smoke against configured external model providers",
  "postgres: requires a live disposable Postgres database",
]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = "uvicorn"
ignore_missing_imports = true
