[build-system]
requires = ["editables>=0.6,<1", "hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "extent-api"
version = "0.1.0"
description = "FastAPI backend authority for the Extent evidence desk."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.18,<2",
  "fastapi>=0.116,<1",
  "pgvector>=0.5,<1",
  "psycopg[binary]>=3.3,<4",
  "pydantic-settings>=2.10,<3",
  "SQLAlchemy>=2.0,<2.1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.16,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/extent_api"]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "uvicorn"
ignore_missing_imports = true
